<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Saves</title>
<style>
  @font-face { font-family: "Silkscreen"; src: url("../assets/fonts/Silkscreen.woff2") format("woff2"); font-display: block; }

  :root {
    --bg: #0a1c16;
    --panel: #10291f;
    --row-hover: #183a2c;
    --row-selected: #1f4d3b;
    --line: #29503f;
    --text: #e8f5ee;
    --muted: #8fb8a4;
    --accent: #f2c14e;
    --accent-ink: #1a1405;
    --danger: #e06c5a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font: 16px "Silkscreen", monospace;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .subtitle { color: var(--muted); font-size: 12px; }

  main {
    flex: 1;
    min-height: 0;
    padding: 10px 12px;
    display: flex;
  }
  #list {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
  }
  #list li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    cursor: default;
    position: relative;
  }
  #list li:last-child { border-bottom: 0; }
  #list li:hover { background: var(--row-hover); }
  #list li[aria-selected="true"] { background: var(--row-selected); }
  #list li[aria-selected="true"]::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
  }
  .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bucks { font-variant-numeric: tabular-nums; color: var(--accent); text-align: right; white-space: nowrap; align-self: center; }
  .bucks small { color: var(--muted); font-size: 11px; margin-left: 3px; }
  .meta { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }

  .empty {
    margin: auto;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    max-width: 380px;
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 15px; }

  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  #status { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.error { color: var(--danger); }
  button {
    font: 600 14px "Segoe UI", system-ui, sans-serif;
    padding: 8px 20px;
    min-width: 96px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.45; cursor: default; filter: none; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 20px;
    width: min(380px, calc(100vw - 32px));
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
  dialog h2 { margin: 0 0 6px; font: 14px "Silkscreen", monospace; color: var(--accent); letter-spacing: 0.04em; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  dialog input {
    width: 100%;
    padding: 9px 10px;
    font: 15px "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    margin-bottom: 4px;
  }
  dialog input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .field-error { color: var(--danger); font-size: 12px; min-height: 16px; margin: 0 0 10px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

  .notice { margin: auto; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>SNAKE SAVES</h1>
  <span class="subtitle" id="count"></span>
</header>

<main>
  <ul id="list" role="listbox" aria-label="Saves" hidden></ul>
  <div id="empty" class="empty" hidden>
    <strong>No saves yet</strong>
    Press <b>New</b> to start a save. Every save keeps its own snake, bucks and progress.
  </div>
  <div id="notice" class="notice" hidden>
    Open this window from SnakeGame.exe to see your saves.
  </div>
</main>

<footer>
  <div id="status" role="status" aria-live="polite"></div>
  <button id="new" type="button">New</button>
  <button id="play" type="button" class="primary" disabled>Play</button>
</footer>

<dialog id="new-dialog" aria-labelledby="new-title">
  <form method="dialog" id="new-form">
    <h2 id="new-title">NEW SAVE</h2>
    <p>Name it. You can start playing as soon as it's made.</p>
    <input id="new-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" aria-label="Save title">
    <div class="field-error" id="new-error"></div>
    <div class="dialog-actions">
      <button type="button" id="new-cancel">Cancel</button>
      <button type="submit" class="primary" id="new-create">Create</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

/* =========================================================
   The saves window. It has no access to files: the launcher
   (SnakeGame.exe) reads and writes the .world files for it,
   and this page talks to it through the WebView2 message bridge.
   Protocol (docs/WORLDS.md):
     page -> launcher   "worlds:list"   "world:write:<id>:<json>"   "world:play:<id>"
     launcher -> page   "world|<id>|<json>" (one per file), then "end|"
   ========================================================= */

const bridge = window.chrome && window.chrome.webview;
const IMPORT_FLAG = "snakeWorldsImported_v1";   // set once the old single save has been offered as a world

const els = {
  list: document.getElementById("list"),
  empty: document.getElementById("empty"),
  notice: document.getElementById("notice"),
  count: document.getElementById("count"),
  status: document.getElementById("status"),
  play: document.getElementById("play"),
  new: document.getElementById("new"),
  dialog: document.getElementById("new-dialog"),
  form: document.getElementById("new-form"),
  name: document.getElementById("new-name"),
  error: document.getElementById("new-error"),
  cancel: document.getElementById("new-cancel")
};

let worlds = [];            // { id, title, created, saved, bucks }
let selectedId = null;
let loading = null;         // the worlds collected for the list being read
let playTimer = 0;

/* ---------- helpers ---------- */

function setStatus(text, isError) {
  els.status.textContent = text || "";
  els.status.classList.toggle("error", !!isError);
}

function parseJson(text) {
  try { return JSON.parse(text); } catch (e) { return null; }
}

// What a save holds, read from its file: the snake's Snakebucks (shared by all its profiles)
function bucksOf(data) {
  const meta = parseJson((data && data.snakeMeta_v1) || "null");
  const n = meta && Number(meta.snakebucks);
  return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
}

function formatDate(ms) {
  if (!ms) return "never";
  const d = new Date(ms);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + " " +
    d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function timeAgo(ms) {
  if (!ms) return "never";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  if (s < 86400 * 14) return Math.floor(s / 86400) + " days ago";
  return formatDate(ms);
}

function newId() {
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  return "w" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
}

function fileText(id, title, created, saved, data) {
  return JSON.stringify({
    format: "snakegame-world",
    version: 1,
    id,
    title,
    created,
    saved,
    data: data || {}
  });
}

/* ---------- reading the list ---------- */

function refresh() {
  if (!bridge) return;
  loading = [];
  bridge.postMessage("worlds:list");
}

function finishList(list) {
  worlds = [];
  let damaged = 0;
  list.forEach(w => {
    const file = parseJson(w.text);
    if (!file || typeof file !== "object") { damaged++; return; }   // a file that can't be read is left alone
    worlds.push({
      id: w.id,
      title: typeof file.title === "string" && file.title.trim() ? file.title : "Untitled save",
      created: Number(file.created) || 0,
      saved: Number(file.saved) || 0,
      bucks: bucksOf(file.data)
    });
  });
  worlds.sort((a, b) => (b.saved - a.saved) || a.title.localeCompare(b.title));
  if (damaged) setStatus(damaged + (damaged === 1 ? " save file can't be read." : " save files can't be read."), true);
  if (!worlds.some(w => w.id === selectedId)) selectedId = worlds.length ? worlds[0].id : null;
  render();
}

/* An older version of the game kept one save in this browser's storage. Offer it once as a world. */
function offerOldSave() {
  try {
    if (localStorage.getItem(IMPORT_FLAG)) return false;
    localStorage.setItem(IMPORT_FLAG, "1");
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("snake") && !k.includes("_rescue_")) data[k] = localStorage.getItem(k);
    }
    if (!data.snakeMeta_v1 && !data.snakeSave_v4) return false;
    const id = newId();
    const now = Date.now();
    bridge.postMessage("world:write:" + id + ":" + fileText(id, "Your saved game", now, now, data));
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------- drawing ---------- */

function render() {
  els.list.textContent = "";
  worlds.forEach(w => {
    const li = document.createElement("li");
    li.id = "w-" + w.id;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", w.id === selectedId ? "true" : "false");
    li.dataset.id = w.id;

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = w.title;

    const bucks = document.createElement("div");
    bucks.className = "bucks";
    bucks.textContent = w.bucks.toLocaleString();
    const unit = document.createElement("small");
    unit.textContent = "SB";
    bucks.appendChild(unit);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "Last played " + timeAgo(w.saved) + " · Created " + formatDate(w.created);

    li.append(title, bucks, meta);
    els.list.appendChild(li);
  });

  const any = worlds.length > 0;
  els.list.hidden = !any;
  els.empty.hidden = any;
  els.count.textContent = any ? worlds.length + (worlds.length === 1 ? " save" : " saves") : "";
  els.play.disabled = !selectedId;
}

function select(id) {
  selectedId = id;
  els.list.querySelectorAll("li").forEach(li => li.setAttribute("aria-selected", li.dataset.id === id ? "true" : "false"));
  const li = document.getElementById("w-" + id);
  if (li) li.scrollIntoView({ block: "nearest" });
  els.play.disabled = !id;
}

/* ---------- actions ---------- */

function play(id) {
  if (!id || !bridge) return;
  const world = worlds.find(w => w.id === id);
  setStatus("Starting " + (world ? "“" + world.title + "”" : "save") + "…");
  els.play.disabled = true;
  bridge.postMessage("world:play:" + id);
  clearTimeout(playTimer);
  playTimer = setTimeout(() => { els.play.disabled = !selectedId; setStatus(""); }, 4000);
}

function openNew() {
  els.error.textContent = "";
  els.name.value = "Save " + (worlds.length + 1);
  els.dialog.showModal();
  els.name.select();
}

function createFromDialog() {
  const title = els.name.value.trim().replace(/\s+/g, " ");
  if (!title) { els.error.textContent = "Give the save a name."; els.name.focus(); return; }
  if (worlds.some(w => w.title.toLowerCase() === title.toLowerCase())) {
    els.error.textContent = "There is already a save with that name.";
    els.name.focus();
    return;
  }
  const id = newId();
  const created = Date.now();
  // An empty save: no progress yet, at 0 Snakebucks. The game starts it fresh when it opens.
  bridge.postMessage("world:write:" + id + ":" + fileText(id, title, created, 0, {}));
  els.dialog.close();
  selectedId = id;
  setStatus("Created “" + title + "”.");
  refresh();
}

/* ---------- wiring ---------- */

els.list.addEventListener("click", e => {
  const li = e.target.closest("li");
  if (li) select(li.dataset.id);
});
els.list.addEventListener("dblclick", e => {
  const li = e.target.closest("li");
  if (li) { select(li.dataset.id); play(li.dataset.id); }
});
els.play.addEventListener("click", () => play(selectedId));
els.new.addEventListener("click", openNew);
els.cancel.addEventListener("click", () => els.dialog.close());
els.form.addEventListener("submit", e => { e.preventDefault(); createFromDialog(); });
els.name.addEventListener("input", () => { els.error.textContent = ""; });

document.addEventListener("keydown", e => {
  if (els.dialog.open) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!worlds.length) return;
    const i = worlds.findIndex(w => w.id === selectedId);
    const next = Math.min(worlds.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)));
    select(worlds[next].id);
    e.preventDefault();
  } else if (e.key === "Enter") {
    play(selectedId);
  } else if (e.key === "n" || e.key === "N") {
    openNew();
  }
});

if (bridge) {
  bridge.addEventListener("message", e => {
    const msg = String(e.data);
    if (msg === "end|") {
      if (!loading) return;
      const list = loading;
      loading = null;
      // Only when there are no saves yet: the old single save becomes the first one
      if (list.length === 0 && offerOldSave()) { refresh(); return; }
      finishList(list);
      return;
    }
    if (msg.startsWith("world|") && loading) {
      const first = msg.indexOf("|");
      const second = msg.indexOf("|", first + 1);
      if (second > first) loading.push({ id: msg.slice(first + 1, second), text: msg.slice(second + 1) });
    }
  });
  refresh();
} else {
  els.notice.hidden = false;
  els.list.hidden = true;
  els.empty.hidden = true;
  els.new.disabled = true;
  els.play.disabled = true;
}
</script>
</body>
</html>
