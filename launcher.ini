; ==================================================================
;  LAUNCHER SETTINGS (read by SerpentGame.exe each time it starts)
; ==================================================================

[window]
title      = Serpent
width      = 1280          ; starting size, before the launcher remembers yours
height     = 800
fullscreen = true          ; true = always start in full screen (F11 or Alt+Enter switches back to a window)

[developer]
devTools   = true          ; F12 opens the developer tools (console, inspector). Turn off for release.
reloadKey  = true          ; F5 reloads the game, so content edits show up. Turn off for release.

[mods]
folder     = documents     ; documents = Documents\SerpentGame\mods,  game = the mods folder next to this file
