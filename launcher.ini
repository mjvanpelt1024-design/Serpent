; ==================================================================
;  LAUNCHER SETTINGS (read by SnakeGame.exe each time it starts)
; ==================================================================

[window]
title      = Snake
width      = 1280          ; starting size, before the launcher remembers yours
height     = 800
fullscreen = false         ; true = always start in full screen

[developer]
devTools   = true          ; F12 opens the developer tools (console, inspector). Turn off for release.
reloadKey  = true          ; F5 reloads the game, so content edits show up. Turn off for release.

[mods]
folder     = documents     ; documents = Documents\SnakeGame\mods,  game = the mods folder next to this file
